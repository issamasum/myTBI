services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/trianglebahaiinstitute:cached
      - trianglebahaiinstitute-uv-cache:/home/vscode/.cache/uv
      - trianglebahaiinstitute-playwright-cache:/home/vscode/.cache/ms-playwright
      - trianglebahaiinstitute-npm-cache:/home/vscode/.npm
      - trianglebahaiinstitute-pnpm-store:/home/vscode/.local/share/pnpm/store
    working_dir: /workspaces/trianglebahaiinstitute
    command: sleep infinity
    environment:
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: copy
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/trianglebahaiinstitute
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trianglebahaiinstitute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - trianglebahaiinstitute-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trianglebahaiinstitute"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  trianglebahaiinstitute-postgres-data:
  trianglebahaiinstitute-uv-cache:
  trianglebahaiinstitute-playwright-cache:
  trianglebahaiinstitute-npm-cache:
  trianglebahaiinstitute-pnpm-store:
